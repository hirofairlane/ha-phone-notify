name: "Phone Notify"
version: "0.1.0"
slug: "phone_notify"
description: "Place a real phone call, speak a message, and listen for a spoken response"
url: "https://github.com/hirofairlane/ha-phone-notify"
arch:
  - amd64
  - aarch64
init: false
host_dbus: true
host_network: true
map:
  - config:rw
options:
  vosk_model_url: "https://alphacephei.com/vosk/models/vosk-model-es-0.42.zip"
  tts_voice_url: "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium/es_ES-davefx-medium.onnx"
  tts_voice_config_url: "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium/es_ES-davefx-medium.onnx.json"
  bluetooth_adapter: "hci0"
  mqtt_topic_prefix: "phone_notify"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  phone_adb_address: ""
  phone_bt_mac: ""
schema:
  vosk_model_url: str
  tts_voice_url: str
  tts_voice_config_url: str
  bluetooth_adapter: str
  mqtt_topic_prefix: str
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  phone_adb_address: str
  phone_bt_mac: str
