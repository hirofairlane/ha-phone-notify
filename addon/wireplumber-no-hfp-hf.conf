# Only a2dp roles are needed here — this container's job is to be an
# HFP Hands-Free (headset) role, which HandsFree-Linux registers itself
# via BlueZ D-Bus (bluetooth/hfp_profile.py), not something WirePlumber
# should also be managing. Explicitly excluding hfp_hf AND hfp_ag/hsp_ag
# (WirePlumber has no reason to also expose an Audio-Gateway role on
# this same adapter — it isn't a phone — and leaving it enabled was
# adding an unnecessary second SDP registration on the same adapter
# while debugging an intermittent SLC establishment failure).
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source ]
}
